<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Tanglaw sa Dilim</title>
    <meta
      name="description"
      content="Illuminating Campus Extremism and Aggression — a live advocacy presentation."
    />
    <!-- Inline, so the deck makes no network request of any kind at runtime. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230b0d1a'/%3E%3Ccircle cx='16' cy='16' r='7' fill='none' stroke='%23e8a020' stroke-width='2'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <!-- The renderer sizes itself from this container, never from the viewport,
         so it behaves identically fullscreen and windowed. -->
    <div id="stage"></div>

    <!-- DOM overlay. Captions and shard labels live here, above the canvas.
         Nothing in here is ever positioned by fixed pixel offsets. -->
    <div id="overlay" aria-live="polite"></div>

    <!-- The B-key veil. A real element rather than a black slide, so the
         operator decides how long the darkness lasts (CONTEXT.md §10). -->
    <div id="veil" hidden></div>

    <!-- Muzzle flash. A DOM element rather than a scene light: it has to cover
         the whole frame for a handful of frames, and the renderer has no cheap
         way to do that. -->
    <div id="flash" hidden></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
