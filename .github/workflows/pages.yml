# Unlike the ppt-js deck, this one has a real build step — Vite bundles three.js
# and anime.js and fingerprints the assets — so the workflow builds first and
# uploads dist/ rather than uploading the repository as-is.
#
# vite.config.js sets `base: './'`, so the built deck works at any path. That is
# what lets the same dist/ run from the Pages project subpath AND from a file
# path on the operator's laptop, which is the failsafe that matters on the day
# (CONTEXT.md §10 — venue wifi will fail).
name: Deploy deck to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
